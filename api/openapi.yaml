        can_delete_all_messages:
          type: boolean
          default: true
        can_edit_name:
          type: boolean
          default: true
        can_edit_bio:
          type: boolean
          default: true
        can_edit_profile_photo:
          type: boolean
          default: true
        can_edit_username:
          type: boolean
          default: true
