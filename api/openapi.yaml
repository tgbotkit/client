components:
  securitySchemes:
    TelegramBotToken:
      type: http
      scheme: bearer
      bearerFormat: TelegramBotToken
      description: Telegram bot token included in the request URL segment (bot{token}).
  schemas:
   AcceptedGiftTypes:
      type: object
      description: |-
        This object describes the types of gifts that can be gifted to a user or a chat.
      x-tags:
        - Available types
      properties:
        unlimited_gifts:
          type: boolean
        limited_gifts:
          type: boolean
        unique_gifts:
          type: boolean
        premium_subscription:
          type: boolean
      required:
        - unlimited_gifts
        - limited_gifts
        - unique_gifts
        - premium_subscription
   AffiliateInfo:
      type: object
      description: |-
        Contains information about the affiliate that received a commission via this transaction.
      x-tags:
        - Payments
      properties:
        affiliate_user:
          $ref: '#/components/schemas/User'
        affiliate_chat:
          $ref: '#/components/schemas/Chat'
        commission_per_mille:
          type: integer
        amount:
          type: integer
        nanostar_amount:
          type: integer
      required:
        - commission_per_mille
        - amount
   Animation:
      type: object
      description: |-
        This object represents an animation file (GIF or H.264/MPEG-4 AVC video without sound).
      x-tags:
        - Available types
      properties:
        file_id:
          type: string
        file_unique_id:
          type: string
        width:
          type: integer
        height:
          type: integer
        duration:
          type: integer
        thumbnail:
          $ref: '#/components/schemas/PhotoSize'
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
      required:
        - file_id
        - file_unique_id
        - width
        - height
        - duration
   Audio:
      type: object
      description: |-
        This object represents an audio file to be treated as music by the Telegram clients.
      x-tags:
        - Available types
      properties:
        file_id:
          type: string
        file_unique_id:
          type: string
        duration:
          type: integer
        performer:
          type: string
        title:
          type: string
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        thumbnail:
          $ref: '#/components/schemas/PhotoSize'
      required:
        - file_id
        - file_unique_id
        - duration
   BackgroundFill:
      type: object
      description: |-
        This object describes the way a background is filled based on the selected colors. Currently, it can be one of
        BackgroundFillSolid
        BackgroundFillGradient
        BackgroundFillFreeformGradient
      x-tags:
        - Available types
   BackgroundFillFreeformGradient:
      type: object
      description: |-
        The background is a freeform gradient that rotates after every message in the chat.
      x-tags:
        - Available types
      properties:
        type:
          type: string
        colors:
          type: array
          items:
              type: integer
      required:
        - type
        - colors
   BackgroundFillGradient:
      type: object
      description: |-
        The background is a gradient fill.
      x-tags:
        - Available types
      properties:
        type:
          type: string
        top_color:
          type: integer
        bottom_color:
          type: integer
        rotation_angle:
          type: integer
      required:
        - type
        - top_color
        - bottom_color
        - rotation_angle
   BackgroundFillSolid:
      type: object
      description: |-
        The background is filled using the selected color.
      x-tags:
        - Available types
      properties:
        type:
          type: string
        color:
          type: integer
      required:
        - type
        - color
   BackgroundType:
      type: object
      description: |-
        This object describes the type of a background. Currently, it can be one of
        BackgroundTypeFill
        BackgroundTypeWallpaper
        BackgroundTypePattern
        BackgroundTypeChatTheme
      x-tags:
        - Available types
   BackgroundTypeChatTheme:
      type: object
      description: |-
        The background is taken directly from a built-in chat theme.
      x-tags:
        - Available types
      properties:
        type:
          type: string
        theme_name:
          type: string
      required:
        - type
        - theme_name
   BackgroundTypeFill:
      type: object
      description: |-
        The background is automatically filled based on the selected colors.
      x-tags:
        - Available types
      properties:
        type:
          type: string
        fill:
          $ref: '#/components/schemas/BackgroundFill'
        dark_theme_dimming:
          type: integer
      required:
        - type
        - fill
        - dark_theme_dimming
   BackgroundTypePattern:
      type: object
      description: |-
        The background is a .PNG or .TGV (gzipped subset of SVG with MIME type “application/x-tgwallpattern”) pattern to be combined with the background fill chosen by the user.
      x-tags:
        - Available types
      properties:
        type:
          type: string
        document:
          $ref: '#/components/schemas/Document'
        fill:
          $ref: '#/components/schemas/BackgroundFill'
        intensity:
          type: integer
        is_inverted:
          type: boolean
          default: true
        is_moving:
          type: boolean
          default: true
      required:
        - type
        - document
        - fill
        - intensity
   BackgroundTypeWallpaper:
      type: object
      description: |-
        The background is a wallpaper in the JPEG format.
      x-tags:
        - Available types
      properties:
        type:
          type: string
        document:
          $ref: '#/components/schemas/Document'
        dark_theme_dimming:
          type: integer
        is_blurred:
          type: boolean
          default: true
        is_moving:
          type: boolean
          default: true
      required:
        - type
        - document
        - dark_theme_dimming
   Birthdate:
      type: object
      description: |-
        Describes the birthdate of a user.
      x-tags:
        - Available types
      properties:
        day:
          type: integer
        month:
          type: integer
        year:
          type: integer
      required:
        - day
        - month
   BotCommand:
      type: object
      description: |-
        This object represents a bot command.
      x-tags:
        - Available types
      properties:
        command:
          type: string
        description:
          type: string
      required:
        - command
        - description
   BotCommandScope:
      type: object
      description: |-
        This object represents the scope to which bot commands are applied. Currently, the following 7 scopes are supported:
        BotCommandScopeDefault
        BotCommandScopeAllPrivateChats
        BotCommandScopeAllGroupChats
        BotCommandScopeAllChatAdministrators
        BotCommandScopeChat
        BotCommandScopeChatAdministrators
        BotCommandScopeChatMember
      x-tags:
        - Available types
   BotCommandScopeAllChatAdministrators:
      type: object
      description: |-
        Represents the scope of bot commands, covering all group and supergroup chat administrators.
      x-tags:
        - Available types
      properties:
        type:
          type: string
      required:
        - type
   BotCommandScopeAllGroupChats:
      type: object
      description: |-
        Represents the scope of bot commands, covering all group and supergroup chats.
      x-tags:
        - Available types
      properties:
        type:
          type: string
      required:
        - type
   BotCommandScopeAllPrivateChats:
      type: object
      description: |-
        Represents the scope of bot commands, covering all private chats.
      x-tags:
        - Available types
      properties:
        type:
          type: string
      required:
        - type
   BotCommandScopeChat:
      type: object
      description: |-
        Represents the scope of bot commands, covering a specific chat.
      x-tags:
        - Available types
      properties:
        type:
          type: string
        chat_id:
          type: integer
      required:
        - type
        - chat_id
   BotCommandScopeChatAdministrators:
      type: object
      description: |-
        Represents the scope of bot commands, covering all administrators of a specific group or supergroup chat.
      x-tags:
        - Available types
      properties:
        type:
          type: string
        chat_id:
          type: integer
      required:
        - type
        - chat_id
   BotCommandScopeChatMember:
      type: object
      description: |-
        Represents the scope of bot commands, covering a specific member of a group or supergroup chat.
      x-tags:
        - Available types
      properties:
        type:
          type: string
        chat_id:
          type: integer
        user_id:
          type: integer
      required:
        - type
        - chat_id
        - user_id
   BotCommandScopeDefault:
      type: object
      description: |-
        Represents the default scope of bot commands. Default commands are used if no commands with a narrower scope are specified for the user.
      x-tags:
        - Available types
      properties:
        type:
          type: string
      required:
        - type
   BotDescription:
      type: object
      description: |-
        This object represents the bot's description.
      x-tags:
        - Available types
      properties:
        description:
          type: string
      required:
        - description
   BotName:
      type: object
      description: |-
        This object represents the bot's name.
      x-tags:
        - Available types
      properties:
        name:
          type: string
      required:
        - name
   BotShortDescription:
      type: object
      description: |-
        This object represents the bot's short description.
      x-tags:
        - Available types
      properties:
        short_description:
          type: string
      required:
        - short_description
   BusinessBotRights:
