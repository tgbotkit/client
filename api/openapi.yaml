    post:
      operationId: unpinAllGeneralForumTopicMessages
      tags:
        - Available methods
      description: |-
        Use this method to clear the list of pinned messages in a General forum topic. The bot must be an administrator in the chat for this to work and must have the can_pin_messages administrator right in the supergroup. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
              required:
                - chat_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /unpinChatMessage:
    post:
      operationId: unpinChatMessage
      tags:
        - Available methods
      description: |-
        Use this method to remove a message from the list of pinned messages in a chat. In private chats and channel direct messages chats, all messages can be unpinned. Conversely, the bot must be an administrator with the 'can_pin_messages' right or the 'can_edit_messages' right to unpin messages in groups and channels respectively. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                business_connection_id:
                  type: string
                chat_id:
                  type: integer
                message_id:
                  type: integer
              required:
                - business_connection_id
                - chat_id
                - message_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /upgradeGift:
    post:
      operationId: upgradeGift
      tags:
        - Available methods
      description: |-
        Upgrades a given regular gift to a unique gift. Requires the can_transfer_and_upgrade_gifts business bot right. Additionally requires the can_transfer_stars business bot right if the upgrade is paid. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                business_connection_id:
                  type: string
                keep_original_details:
                  type: boolean
                owned_gift_id:
                  type: string
                star_count:
                  type: integer
              required:
                - business_connection_id
                - keep_original_details
                - owned_gift_id
                - star_count
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /uploadStickerFile:
    post:
      operationId: uploadStickerFile
      tags:
        - Stickers
      description: |-
        Use this method to upload a file with a sticker for later use in the createNewStickerSet, addStickerToSet, or replaceStickerInSet methods (the file can be used multiple times). Returns the uploaded File on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sticker_format:
                  type: string
                user_id:
                  type: integer
              required:
                - sticker_format
                - user_id
          multipart/form-data:
            schema:
              type: object
              properties:
                sticker:
                  type: string
                  format: binary
                sticker_format:
                  type: string
                user_id:
                  type: integer
              required:
