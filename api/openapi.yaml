  /setWebhook:
    post:
      operationId: setWebhook
      tags:
        - Getting updates
      description: |-
        Use this method to specify a URL and receive incoming updates via an outgoing webhook. Whenever there is an update for the bot, we will send an HTTPS POST request to the specified URL, containing a JSON-serialized Update. In case of an unsuccessful request (a request with response HTTP status code different from 2XY), we will repeat the request and give up after a reasonable amount of attempts. Returns True on success.
        If you'd like to make sure that the webhook was set by you, you can specify secret data in the parameter secret_token. If specified, the request will contain a header “X-Telegram-Bot-Api-Secret-Token” with the secret token as content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowed_updates:
                  type: array
                  items:
                      type: string
                drop_pending_updates:
                  type: boolean
                ip_address:
                  type: string
                max_connections:
                  type: integer
                secret_token:
                  type: string
                url:
                  type: string
              required:
                - allowed_updates
                - drop_pending_updates
                - ip_address
                - max_connections
                - secret_token
                - url
          multipart/form-data:
            schema:
              type: object
              properties:
                allowed_updates:
                  type: array
                  items:
                      type: string
                certificate:
                  type: string
                  format: binary
                drop_pending_updates:
                  type: boolean
                ip_address:
                  type: string
                max_connections:
                  type: integer
                secret_token:
                  type: string
                url:
                  type: string
              required:
                - allowed_updates
                - certificate
                - drop_pending_updates
                - ip_address
                - max_connections
                - secret_token
                - url
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
