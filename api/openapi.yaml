      x-tags:
        - Available types
      properties:
        title:
          type: string
        message:
          type: string
        sticker:
          $ref: '#/components/schemas/Sticker'
   BusinessLocation:
      type: object
      description: |-
        Contains information about the location of a Telegram Business account.
      x-tags:
