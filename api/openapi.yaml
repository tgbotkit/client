                - chat_id
                - direct_messages_topic_id
                - disable_notification
                - duration
                - message_effect_id
                - message_thread_id
                - parse_mode
                - protect_content
                - reply_markup
                - reply_parameters
                - suggested_post_parameters
                - voice
          multipart/form-data:
            schema:
              type: object
              properties:
                allow_paid_broadcast:
                  type: boolean
                business_connection_id:
                  type: string
                caption:
                  type: string
                caption_entities:
                  type: array
                  items:
                      $ref: '#/components/schemas/MessageEntity'
                chat_id:
                  type: integer
                direct_messages_topic_id:
                  type: integer
                disable_notification:
                  type: boolean
                duration:
                  type: integer
                message_effect_id:
                  type: string
                message_thread_id:
                  type: integer
                parse_mode:
                  type: string
                protect_content:
                  type: boolean
                reply_markup:
                  anyOf:
                      - $ref: '#/components/schemas/InlineKeyboardMarkup'
                      - $ref: '#/components/schemas/ReplyKeyboardMarkup'
                      - $ref: '#/components/schemas/ReplyKeyboardRemove'
                      - $ref: '#/components/schemas/ForceReply'
                reply_parameters:
                  $ref: '#/components/schemas/ReplyParameters'
                suggested_post_parameters:
                  $ref: '#/components/schemas/SuggestedPostParameters'
                voice:
                  type: string
                  format: binary
              required:
