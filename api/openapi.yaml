openapi: 3.0.0
info:
  title: "Telegram Bot API"
  version: "9.2"
  description: |-
    This OpenAPI specification was generated using the [tgbotspec](https://github.com/metalagman/tgbotspec) tool.
servers:
  - url: "https://api.telegram.org/bot{botToken}"
    description: Telegram Bot API endpoint; substitute {botToken} with your bot token.
    variables:
      botToken:
        description: Telegram bot token obtained from BotFather.
        default: "<bot_token>"
security:
  - TelegramBotToken: []
paths:
  /addStickerToSet:
    post:
      operationId: addStickerToSet
      tags:
        - Stickers
      description: |-
        Use this method to add a new sticker to a set created by the bot. Emoji sticker sets can have up to 200 stickers. Other sticker sets can have up to 120 stickers. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sticker:
                  $ref: '#/components/schemas/InputSticker'
                user_id:
                  type: integer
              required:
                - name
                - sticker
                - user_id
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                sticker:
                  $ref: '#/components/schemas/InputSticker'
                user_id:
                  type: integer
              required:
                - name
                - sticker
                - user_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /answerCallbackQuery:
    post:
      operationId: answerCallbackQuery
      tags:
        - Available methods
      description: |-
        Use this method to send answers to callback queries sent from inline keyboards. The answer will be displayed to the user as a notification at the top of the chat screen or as an alert. On success, True is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cache_time:
                  type: integer
                callback_query_id:
                  type: string
                show_alert:
                  type: boolean
                text:
                  type: string
                url:
                  type: string
              required:
                - cache_time
                - callback_query_id
                - show_alert
                - text
                - url
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /answerInlineQuery:
    post:
      operationId: answerInlineQuery
      tags:
        - Inline mode
      description: |-
        Use this method to send answers to an inline query. On success, True is returned.No more than 50 results per query are allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                button:
                  $ref: '#/components/schemas/InlineQueryResultsButton'
                cache_time:
                  type: integer
                inline_query_id:
                  type: string
                is_personal:
                  type: boolean
                next_offset:
                  type: string
                results:
                  type: array
                  items:
                      $ref: '#/components/schemas/InlineQueryResult'
              required:
                - button
                - cache_time
                - inline_query_id
                - is_personal
                - next_offset
                - results
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /answerPreCheckoutQuery:
    post:
      operationId: answerPreCheckoutQuery
      tags:
        - Payments
      description: |-
        Once the user has confirmed their payment and shipping details, the Bot API sends the final confirmation in the form of an Update with the field pre_checkout_query. Use this method to respond to such pre-checkout queries. On success, True is returned. Note: The Bot API must receive an answer within 10 seconds after the pre-checkout query was sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                error_message:
                  type: string
                ok:
                  type: boolean
                pre_checkout_query_id:
                  type: string
              required:
                - error_message
                - ok
                - pre_checkout_query_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /answerShippingQuery:
    post:
      operationId: answerShippingQuery
      tags:
        - Payments
      description: |-
        If you sent an invoice requesting a shipping address and the parameter is_flexible was specified, the Bot API will send an Update with a shipping_query field to the bot. Use this method to reply to shipping queries. On success, True is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                error_message:
                  type: string
                ok:
                  type: boolean
                shipping_options:
                  type: array
                  items:
                      $ref: '#/components/schemas/ShippingOption'
                shipping_query_id:
                  type: string
              required:
                - error_message
                - ok
                - shipping_options
                - shipping_query_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /answerWebAppQuery:
    post:
      operationId: answerWebAppQuery
      tags:
        - Inline mode
      description: |-
        Use this method to set the result of an interaction with a Web App and send a corresponding message on behalf of the user to the chat from which the query originated. On success, a SentWebAppMessage object is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  $ref: '#/components/schemas/InlineQueryResult'
                web_app_query_id:
                  type: string
              required:
                - result
                - web_app_query_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/SentWebAppMessage'
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /approveChatJoinRequest:
    post:
      operationId: approveChatJoinRequest
      tags:
        - Available methods
      description: |-
        Use this method to approve a chat join request. The bot must be an administrator in the chat for this to work and must have the can_invite_users administrator right. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                user_id:
                  type: integer
              required:
                - chat_id
                - user_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /approveSuggestedPost:
    post:
      operationId: approveSuggestedPost
      tags:
        - Updating messages
      description: |-
        Use this method to approve a suggested post in a direct messages chat. The bot must have the 'can_post_messages' administrator right in the corresponding channel chat. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                message_id:
                  type: integer
                send_date:
                  type: integer
              required:
                - chat_id
                - message_id
                - send_date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /banChatMember:
    post:
      operationId: banChatMember
      tags:
        - Available methods
      description: |-
        Use this method to ban a user in a group, a supergroup or a channel. In the case of supergroups and channels, the user will not be able to return to the chat on their own using invite links, etc., unless unbanned first. The bot must be an administrator in the chat for this to work and must have the appropriate administrator rights. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                revoke_messages:
                  type: boolean
                until_date:
                  type: integer
                user_id:
                  type: integer
              required:
                - chat_id
                - revoke_messages
                - until_date
                - user_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /banChatSenderChat:
    post:
      operationId: banChatSenderChat
      tags:
        - Available methods
      description: |-
        Use this method to ban a channel chat in a supergroup or a channel. Until the chat is unbanned, the owner of the banned chat won't be able to send messages on behalf of any of their channels. The bot must be an administrator in the supergroup or channel for this to work and must have the appropriate administrator rights. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                sender_chat_id:
                  type: integer
              required:
                - chat_id
                - sender_chat_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /close:
    post:
      operationId: close
      tags:
        - Available methods
      description: |-
        Use this method to close the bot instance before moving it from one local server to another. You need to delete the webhook before calling this method to ensure that the bot isn't launched again after server restart. The method will return error 429 in the first 10 minutes after the bot is launched. Returns True on success. Requires no parameters.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /closeForumTopic:
    post:
      operationId: closeForumTopic
      tags:
        - Available methods
      description: |-
        Use this method to close an open topic in a forum supergroup chat. The bot must be an administrator in the chat for this to work and must have the can_manage_topics administrator rights, unless it is the creator of the topic. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                message_thread_id:
                  type: integer
              required:
                - chat_id
                - message_thread_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /closeGeneralForumTopic:
    post:
      operationId: closeGeneralForumTopic
      tags:
        - Available methods
      description: |-
        Use this method to close an open 'General' topic in a forum supergroup chat. The bot must be an administrator in the chat for this to work and must have the can_manage_topics administrator rights. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
              required:
                - chat_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /convertGiftToStars:
    post:
      operationId: convertGiftToStars
      tags:
        - Available methods
      description: |-
        Converts a given regular gift to Telegram Stars. Requires the can_convert_gifts_to_stars business bot right. Returns True on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                business_connection_id:
                  type: string
                owned_gift_id:
                  type: string
              required:
                - business_connection_id
                - owned_gift_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: boolean
                        default: true
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /copyMessage:
    post:
      operationId: copyMessage
      tags:
        - Available methods
      description: |-
        Use this method to copy messages of any kind. Service messages, paid media messages, giveaway messages, giveaway winners messages, and invoice messages can't be copied. A quiz poll can be copied only if the value of the field correct_option_id is known to the bot. The method is analogous to the method forwardMessage, but the copied message doesn't have a link to the original message. Returns the MessageId of the sent message on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allow_paid_broadcast:
                  type: boolean
                caption:
                  type: string
                caption_entities:
                  type: array
                  items:
                      $ref: '#/components/schemas/MessageEntity'
                chat_id:
                  type: integer
                direct_messages_topic_id:
                  type: integer
                disable_notification:
                  type: boolean
                from_chat_id:
                  anyOf:
                      - type: integer
                      - type: string
                message_id:
                  type: integer
                message_thread_id:
                  type: integer
                parse_mode:
                  type: string
                protect_content:
                  type: boolean
                reply_markup:
                  anyOf:
                      - $ref: '#/components/schemas/InlineKeyboardMarkup'
                      - $ref: '#/components/schemas/ReplyKeyboardMarkup'
                      - $ref: '#/components/schemas/ReplyKeyboardRemove'
                      - $ref: '#/components/schemas/ForceReply'
                reply_parameters:
                  $ref: '#/components/schemas/ReplyParameters'
                show_caption_above_media:
                  type: boolean
                suggested_post_parameters:
                  $ref: '#/components/schemas/SuggestedPostParameters'
                video_start_timestamp:
                  type: integer
              required:
                - allow_paid_broadcast
                - caption
                - caption_entities
                - chat_id
                - direct_messages_topic_id
                - disable_notification
                - from_chat_id
                - message_id
                - message_thread_id
                - parse_mode
                - protect_content
                - reply_markup
                - reply_parameters
                - show_caption_above_media
                - suggested_post_parameters
                - video_start_timestamp
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/MessageId'
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /copyMessages:
    post:
      operationId: copyMessages
      tags:
        - Available methods
      description: |-
        Use this method to copy messages of any kind. If some of the specified messages can't be found or copied, they are skipped. Service messages, paid media messages, giveaway messages, giveaway winners messages, and invoice messages can't be copied. A quiz poll can be copied only if the value of the field correct_option_id is known to the bot. The method is analogous to the method forwardMessages, but the copied messages don't have a link to the original message. Album grouping is kept for copied messages. On success, an array of MessageId of the sent messages is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                direct_messages_topic_id:
                  type: integer
                disable_notification:
                  type: boolean
                from_chat_id:
                  anyOf:
                      - type: integer
                      - type: string
                message_ids:
                  type: array
                  items:
                      type: integer
                message_thread_id:
                  type: integer
                protect_content:
                  type: boolean
                remove_caption:
                  type: boolean
              required:
                - chat_id
                - direct_messages_topic_id
                - disable_notification
                - from_chat_id
                - message_ids
                - message_thread_id
                - protect_content
                - remove_caption
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        type: array
                        items:
                            $ref: '#/components/schemas/MessageId'
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /createChatInviteLink:
    post:
      operationId: createChatInviteLink
      tags:
        - Available methods
      description: |-
        Use this method to create an additional invite link for a chat. The bot must be an administrator in the chat for this to work and must have the appropriate administrator rights. The link can be revoked using the method revokeChatInviteLink. Returns the new invite link as ChatInviteLink object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                creates_join_request:
                  type: boolean
                expire_date:
                  type: integer
                member_limit:
                  type: integer
                name:
                  type: string
              required:
                - chat_id
                - creates_join_request
                - expire_date
                - member_limit
                - name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/ChatInviteLink'
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /createChatSubscriptionInviteLink:
    post:
      operationId: createChatSubscriptionInviteLink
      tags:
        - Available methods
      description: |-
        Use this method to create a subscription invite link for a channel chat. The bot must have the can_invite_users administrator rights. The link can be edited using the method editChatSubscriptionInviteLink or revoked using the method revokeChatInviteLink. Returns the new invite link as a ChatInviteLink object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: integer
                name:
                  type: string
                subscription_period:
                  type: integer
                subscription_price:
                  type: integer
              required:
                - chat_id
                - name
                - subscription_period
                - subscription_price
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/ChatInviteLink'
                    required:
                      - result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /createForumTopic:
    post:
      operationId: createForumTopic
      tags:
        - Available methods
      description: |-
        Use this method to create a topic in a forum supergroup chat. The bot must be an administrator in the chat for this to work and must have the can_manage_topics administrator rights. Returns information about the created topic as a ForumTopic object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
