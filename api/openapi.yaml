                - business_connection_id
                - caption
                - caption_entities
                - chat_id
                - direct_messages_topic_id
                - disable_notification
                - duration
                - message_effect_id
                - message_thread_id
                - parse_mode
                - protect_content
                - reply_markup
                - reply_parameters
                - suggested_post_parameters
                - voice
      responses:
